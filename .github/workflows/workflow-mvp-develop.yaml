name: Deploy Correspondencias Web for Develop
'on':
  push:
    branches:
      - develop
permissions:
  contents: read
env:
  CLOUDFLARE_ACCOUNT_ID: 3ca9471dadca9766b3dc5de098577052
  WRANGLER_SEND_METRICS: 'false'
  MVP_ENVIRONMENT: dev
  MVP_HEALTH_URL: https://develop.correspondencias.rtechsolution.com.br/
jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Configurar Yarn
        run: |
          npm install --global yarn@1.22.22
      - name: Preparar build isolado do MVP
        id: prepare
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          BUILD_DIRECTORY=$(node deployment/cloudflare/prepare.mjs "$MVP_ENVIRONMENT")
          test -d "$BUILD_DIRECTORY"
          printf 'directory=%s\n' "$BUILD_DIRECTORY" >> "$GITHUB_OUTPUT"
      - name: Instalar dependências do MVP
        working-directory: ${{ steps.prepare.outputs.directory }}
        run: |
          yarn install --frozen-lockfile --ignore-scripts
      - name: Conferir conta Cloudflare
        working-directory: ${{ steps.prepare.outputs.directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MVP_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          yarn --silent wrangler whoami --json > "$RUNNER_TEMP/mvp-cloudflare-identity.json"
          jq -e --arg account "$CLOUDFLARE_ACCOUNT_ID" \
            '.loggedIn == true and any(.accounts[]; .id == $account)' \
            "$RUNNER_TEMP/mvp-cloudflare-identity.json" > /dev/null
      - name: Compilar frontend para Cloudflare
        working-directory: ${{ steps.prepare.outputs.directory }}
        run: |
          yarn cf:build
      - name: Validar publicação Cloudflare
        working-directory: ${{ steps.prepare.outputs.directory }}
        run: |
          yarn wrangler deploy --config wrangler.jsonc --dry-run
      - name: Publicar frontend na Cloudflare
        id: deploy
        working-directory: ${{ steps.prepare.outputs.directory }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MVP_CLOUDFLARE_API_TOKEN }}
        run: |
          yarn wrangler deploy --config wrangler.jsonc
      - name: Confirmar frontend e versão publicada
        id: verify
        timeout-minutes: 13
        run: |
          set -euo pipefail
          HEALTH_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/mvp-health.XXXXXX")
          for ATTEMPT in $(seq 1 24); do
            if HTTP_STATUS=$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
              --dump-header "$HEALTH_DIRECTORY/headers" --output "$HEALTH_DIRECTORY/body" \
              --write-out '%{http_code}' --header 'Cache-Control: no-cache' \
              "$MVP_HEALTH_URL?revision=$GITHUB_SHA&attempt=$ATTEMPT"); then
              APP_REVISION=$(awk 'tolower($1) == "x-app-revision:" { gsub("\r", "", $2); revision = $2 } END { print revision }' "$HEALTH_DIRECTORY/headers")
              if [ "$HTTP_STATUS" = '200' ] && [ "$APP_REVISION" = "$GITHUB_SHA" ]; then
                printf 'Versão %s validada em %s.\n' "$GITHUB_SHA" "$MVP_HEALTH_URL"
                exit 0
              fi
              printf 'Tentativa %s/24: HTTP %s, aguardando a versão publicada.\n' "$ATTEMPT" "$HTTP_STATUS"
            else
              printf 'Tentativa %s/24: aplicação ainda indisponível.\n' "$ATTEMPT"
            fi
            if [ "$ATTEMPT" -lt 24 ]; then sleep 10; fi
          done
          printf 'A aplicação não confirmou a versão %s dentro do prazo.\n' "$GITHUB_SHA" >&2
          exit 1
      - name: Send success message to Google Chat
        if: success()
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GIT_BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.MVP_CHAT_WEBHOOK }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg branch "$GIT_BRANCH" --arg commit "$COMMIT_MESSAGE" '
            {
              "text": "Deploy do projeto Correspondencias",
              "cards": [
                {
                  "sections": [
                    {
                      "widgets": [
                        {
                          "keyValue": {
                            "topLabel": "Projeto",
                            "content": "correspondencias-web"
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Branch",
                            "content": $branch
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Status",
                            "content": "SUCCESS ✅"
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Mensagem",
                            "content": "Deploy para o Correspondencias Web realizado com sucesso!"
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Commit",
                            "content": $commit
                          }
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ')
          HTTP_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL")
          if [ "$HTTP_STATUS" != '200' ]; then
            printf 'O Google Chat recusou o aviso (HTTP %s).\n' "$HTTP_STATUS" >&2
            exit 1
          fi
        id: notify_success
      - name: Send failure message to Google Chat
        if: failure() && steps.verify.outcome != 'success'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GIT_BRANCH: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.MVP_CHAT_WEBHOOK }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg branch "$GIT_BRANCH" --arg commit "$COMMIT_MESSAGE" '
            {
              "text": "Deploy do projeto Correspondencias",
              "cards": [
                {
                  "sections": [
                    {
                      "widgets": [
                        {
                          "keyValue": {
                            "topLabel": "Projeto",
                            "content": "correspondencias-web"
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Branch",
                            "content": $branch
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Status",
                            "content": "FAILED ❌"
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Mensagem",
                            "content": "Deploy para o Correspondencias Web falhou!"
                          }
                        },
                        {
                          "keyValue": {
                            "topLabel": "Commit",
                            "content": $commit
                          }
                        }
                      ]
                    }
                  ]
                }
              ]
            }
          ')
          HTTP_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' --data "$PAYLOAD" "$WEBHOOK_URL")
          if [ "$HTTP_STATUS" != '200' ]; then
            printf 'O Google Chat recusou o aviso (HTTP %s).\n' "$HTTP_STATUS" >&2
            exit 1
          fi
