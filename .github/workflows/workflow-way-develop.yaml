name: Deploy WAY web develop

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit a publicar
        required: false
        type: string
      notify:
        description: Notificar grupo
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: way-deploy-develop
  cancel-in-progress: false

env:
  TARGET_BRANCH: develop
  AWS_REGION: sa-east-1
  IMAGE_NAME: way-correspondencias-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Conferir ambiente
        env:
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          if [ "$WORKFLOW_BRANCH" = "$TARGET_BRANCH" ]; then
            exit 0
          fi
          if [ "$TARGET_BRANCH" = develop ] && [ "$EVENT_NAME" = workflow_dispatch ] &&
             [ "$WORKFLOW_BRANCH" = fix/way-deploy ] && [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] &&
             [ "$NOTIFY" = false ]; then
            exit 0
          fi
          echo 'Ambiente de publicação incompatível com a branch'
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Identificar versão
        run: |
          SOURCE_SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$TARGET_BRANCH"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Publicar frontend em homologação
        env:
          DEPLOY_TOKEN: ${{ secrets.WAY_DEPLOY_HML_TOKEN }}
        run: |
          jq -n --arg branch "$TARGET_BRANCH" --arg commit "$SOURCE_SHA" '{branch:$branch,commit:$commit}' > request.json
          for ATTEMPT in $(seq 1 80); do
            HTTP_STATUS=$(curl --silent --show-error --connect-timeout 10 --max-time 1500 \
              -H "Authorization: Bearer $DEPLOY_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @request.json -o response.json -w '%{http_code}' https://gateway.deploy.way.rtechsolution.com.br/deploy/web/new) || HTTP_STATUS=000
            case "$HTTP_STATUS" in
              200) break ;;
              409|502|000)
                test "$ATTEMPT" -lt 80 || exit 1
                sleep 15
                ;;
              *) cat response.json; exit 1 ;;
            esac
          done
          jq -e --arg commit "$SOURCE_SHA" '.success == true and .commit == $commit' response.json

      - name: Notificar resultado
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.notify)
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WAY_CHAT_WEBHOOK }}
          STATUS: ${{ job.status }}
        run: |
          test -n "$WEBHOOK_URL" || exit 0
          jq -n --arg text "Deploy WAY $IMAGE_NAME ($TARGET_BRANCH): $STATUS" '{text:$text}' > notification.json
          curl --silent --show-error --max-time 15 -H 'Content-Type: application/json' --data-binary @notification.json "$WEBHOOK_URL" >/dev/null
